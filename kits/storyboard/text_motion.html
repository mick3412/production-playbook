<!doctype html>
<!--
  Text-motion kit (production-playbook, storyboard library). One composition, driven by a JSON card:
    ?card=<url of card.json>   the beats to play (layout + text + seconds) and the brand (colours, fonts, handle)
    &wire=1                    animatic: grey slot boxes with the real timing instead of the finished design
  Layouts (each one is a component): hook, bignumber, statement, compare, takeaway, quote (SB-T3), disclosure.
  Motion follows the vocabulary's full recipes: 遮罩揭示字 (lines rise inside a fixed mask, quintic out),
  數字跳動 (quartic out, tabular figures), 描邊繪製 (underline draw, cubic in-out), 滑入推出 / 色塊換場 (brand panel push).
  Safe zone (handbook S0-06, 1080×1920): text inside x 120–960, y 270–1248, and right of x 780 only above y 840.
  The timeline is registered as window.__timelines.card (HyperFrames convention), paused; a renderer seeks it frame by frame.
-->
<html lang="en"><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;width:var(--W,1080px);height:var(--H,1920px);overflow:hidden;background:#000}
#stage{position:relative;width:var(--W,1080px);height:var(--H,1920px);overflow:hidden;background:var(--bg)}
.beat{position:absolute;inset:0;padding:400px 120px 672px 148px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;visibility:hidden}
.beat > *{flex-shrink:0}   /* a tall block (chart, list) must push the page, never squash the title masks above it */
.kicker{font:600 60px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:40px}
.mask{overflow:hidden;padding-bottom:.08em}
.beat:not(.en-mask) .mask{overflow:visible}   /* fade/blur/scale entrances (card.motion.enter) must not be clipped by the line mask */
.line{display:block;will-change:transform}
.h1{font:600 134px/1.0 var(--head);letter-spacing:-.02em}
.h2{font:600 84px/1.08 var(--head);letter-spacing:-.015em}
.body{font:400 50px/1.32 var(--body)}
.small{font:400 54px/1.24 var(--body)}
.accent{color:var(--accent)} .light .accent,.light .kicker,.light .ne{color:var(--accent-ink)} .light .rule{background:var(--accent-ink)}
.num{font:600 300px/1 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.04em;padding-left:28px}
.rule{height:8px;background:var(--accent);width:0;margin-top:34px;border-radius:4px}
.box{max-width:560px;border:5px solid currentColor;border-radius:28px;padding:28px 40px;font:600 78px/1.1 var(--head)}
.ne{font:600 90px/1 var(--head);color:var(--accent);text-align:center;margin:10px 0}
.qw{display:block;font:600 96px/1.04 var(--head);letter-spacing:-.015em}.qw.key{font-size:236px;line-height:.95;color:var(--accent)} .light .qw.key{color:var(--accent-ink)}
.panel{position:absolute;inset:0;z-index:5}
.handle{font:500 58px var(--body);opacity:.9;margin-top:14px}
.series{position:absolute;left:120px;top:290px;font:600 60px var(--body);letter-spacing:.12em;opacity:.9}
.dark{background:var(--ink);color:var(--paper)} .light{background:var(--paper);color:var(--ink)}
.wire .beat *{color:transparent!important;background:#b9d3f6!important;border-color:#8fb6ea!important;border-radius:10px}   /* wireframe: text-layer pieces light blue, visual layer grey */
.wire .beat{background:#efefef!important} .wire .slotlabel{position:absolute;left:96px;top:96px;font:600 28px monospace;color:#666!important;background:none!important}

/* photo story (SB-P) */
.beat.ph,.beat.sp,.beat.cv,.beat.qa,.beat.ct{padding:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.scrim{position:absolute;inset:0;pointer-events:none}
.scrim.top{background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.38) 30%,rgba(0,0,0,0) 52%)}
.scrim.dark{background:linear-gradient(180deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.66) 45%,rgba(0,0,0,.3) 70%,rgba(0,0,0,.15) 100%)}
.scrim.bottom{background:linear-gradient(0deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.3) 40%,rgba(0,0,0,0) 60%)}
.phbox{position:absolute;left:152px;right:120px;top:300px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)} .phbox.mid{top:520px}

.phline{font:600 92px/1.12 var(--head);letter-spacing:.01em} .phbig{font-size:152px;line-height:1.04}
.phnote{font:500 50px/1.4 var(--body);margin-top:24px;max-width:640px}
/* speaker (SB-K) */
.spfull .spframe{position:absolute;left:136px;top:392px;width:auto;height:auto;box-shadow:none;overflow:visible;border-radius:0} .spfull .spname{position:static;display:inline-block}
.scrim.both{background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.6) 22%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 42%,rgba(0,0,0,.84) 52%,rgba(0,0,0,.86) 66%,rgba(0,0,0,.6) 100%)}
.spfull .spimg{object-position:50% 50%}
.spbg{filter:blur(30px) brightness(.34);transform:scale(1.15)}
.sptopic{position:absolute;left:136px;right:120px;top:290px;color:#fff;font:600 58px/1.15 var(--head)}
.sptopic.hook{font:700 146px/1.06 var(--head);color:#fff;padding-left:10px} .sptopic.hook::before{display:none}
.sptopic::before{content:'';display:block;width:120px;height:8px;background:var(--accent);border-radius:4px;margin-bottom:22px}
.spframe{position:absolute;left:120px;top:630px;width:840px;height:360px;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.spimg{width:100%;height:100%;object-fit:cover;object-position:50% 38%;will-change:transform}
.spname{position:absolute;left:28px;bottom:24px;font:600 56px var(--body);color:#fff;background:rgba(0,0,0,.45);padding:8px 20px;border-radius:30px}
.spcap{position:absolute;left:136px;width:624px;top:1010px;height:236px;color:#fff}
.cap{position:absolute;left:0;top:0;width:100%;visibility:hidden;font:600 76px/1.3 var(--body);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.cap.key{font:700 84px/1.18 var(--head);color:var(--accent)} .cap.fact{font:600 64px/1.3 var(--body);border-left:8px solid var(--accent);padding-left:24px}
/* carousel pages (SB-C, 1080×1350) */
.cv{background:var(--ink);color:#fff} .cv .kicker{color:color-mix(in srgb,var(--accent) 55%,#fff)} .cv .scrim.top{background:linear-gradient(180deg,rgba(0,0,0,.74) 0%,rgba(0,0,0,.58) 34%,rgba(0,0,0,0) 62%)} .cvbox{position:absolute;left:96px;right:96px;top:120px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.cvh{font:600 118px/1.12 var(--head)} .cvsub{font:500 50px/1.4 var(--body);text-wrap:pretty;margin-top:28px;max-width:820px}
.swipe{position:absolute;right:84px;bottom:84px;font:600 44px var(--body);color:#fff;background:rgba(0,0,0,.35);padding:14px 30px;border-radius:44px}
.swipe span{display:inline-block;margin-left:8px;color:var(--accent)}
.qa{background:var(--paper);color:var(--ink)} .qaframe{position:absolute;inset:72px;border:4px solid var(--ink);border-radius:36px;padding:72px 72px 150px;display:flex;flex-direction:column;justify-content:flex-start}
.qanum{font:600 200px/1 var(--head);color:var(--accent-ink);margin-bottom:30px} .qaq{font:600 78px/1.2 var(--head)}
.qaa{font:400 56px/1.6 var(--body);text-wrap:pretty;margin-top:auto;padding-top:40px;border-top:3px solid var(--accent)} .qasrc{position:absolute;left:64px;bottom:56px;font:400 34px var(--body);opacity:.7}
.pageno{position:absolute;right:120px;bottom:120px;font:600 44px var(--body);opacity:.85}
.ct{background:var(--ink);color:#fff;display:flex;align-items:center} .ctbox{position:absolute;left:96px;right:96px;top:50%;transform:translateY(-50%)}
.cth{font:600 132px/1.12 var(--head)} .ctsub{font:500 50px/1.45 var(--body);margin-top:32px} .cthandle{font:600 50px var(--body);margin-top:56px;color:color-mix(in srgb,var(--accent) 55%,#fff)}

/* chart (R-05) */
.chartwrap{position:relative;width:820px;height:520px;margin-top:50px} .beat .h2{line-height:1.12} .chart{width:820px;height:520px;overflow:visible}   /* 520 tall: a one-line conclusion + chart + a two-line source note all end above y 1248 */
.chart .axis{stroke:currentColor;stroke-width:3;opacity:.35} .chart .curve{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:var(--paper);stroke:var(--accent);stroke-width:6} .dark .chart .dot{fill:var(--ink)}
.clab{position:absolute;transform:translate(24px,-50%);font:600 60px/1.1 var(--body);white-space:nowrap} .clab.left{transform:translate(calc(-100% - 24px),-50%);text-align:right} .clab.above{transform:translate(-50%,calc(-100% - 28px));text-align:center}
.clab b{display:block;font-size:50px;opacity:.75;font-weight:500} .clab span{font-variant-numeric:tabular-nums}
.cnote{font:400 52px/1.35 var(--body);margin-top:30px;max-width:640px;opacity:.85}
/* steps (SB-T8) */
.step{display:flex;gap:28px;align-items:baseline;margin-top:34px;max-width:640px} .sn{font:600 64px var(--head);color:var(--accent);min-width:90px} .light .sn{color:var(--accent-ink)} .st{font:500 70px/1.2 var(--body)}
/* table (SB-C3) */
.tb{padding:0} .light .tb .kicker{color:var(--accent-ink)} .dark .tb .kicker{color:color-mix(in srgb,var(--accent) 50%,#fff)} .tbhead{position:absolute;left:84px;right:84px;top:96px} .tbh{font-size:92px}
.tbrow{position:absolute;left:72px;right:72px;top:470px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tbcol{border:4px solid currentColor;padding:32px 14px 36px;text-align:center;min-height:430px;display:flex;flex-direction:column;justify-content:space-between}
.tbk{font:600 44px var(--body)} .tbv{font:700 104px/1 var(--head);color:var(--accent)} .light .tbv{color:var(--accent-ink)} .tbs{font:500 38px/1.3 var(--body)}
.tbfoot{position:absolute;left:84px;right:84px;bottom:150px;font:400 36px/1.45 var(--body)}

.vd{padding:0} .vdhead{position:absolute;left:84px;right:84px;top:72px;padding-bottom:22px;border-bottom:6px double currentColor;font:700 56px var(--head);letter-spacing:.04em;text-align:center}
.vdq{position:absolute;left:96px;right:96px;top:260px;font:700 96px/1.15 var(--head)} .vdask{position:absolute;left:96px;bottom:150px;font:600 52px var(--body)}

.stamp.no{color:#C0261B} .stamp.ok{color:#1F7A3A} .vdx{position:absolute;left:96px;right:96px;top:760px;font:500 48px/1.5 var(--body)} .vdsrc{position:absolute;left:96px;bottom:96px;font:400 36px var(--body);opacity:.8}

.rvbig{position:relative;font:800 236px/1 var(--head);letter-spacing:-.03em;color:var(--accent);overflow:hidden;font-variant-numeric:tabular-nums;white-space:nowrap}
.sweep{position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);mix-blend-mode:overlay;pointer-events:none}
.rvsub{margin-top:18px}

.dgsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible} .dgedge{stroke:currentColor;stroke-width:4;opacity:.9} .dgtip{fill:var(--accent)}
.dgstack{margin-top:40px;width:74%;display:flex;flex-direction:column;gap:32px} .dgstack .dgnode{position:static;width:auto}
.dgnode{position:absolute;width:20%;padding:20px 18px;border:3px solid currentColor;font:500 40px/1.25 var(--body);text-align:center;box-sizing:border-box;background:var(--bg-node,transparent)}
.dgnode.key{border-width:5px;font-weight:700;color:var(--accent)} .dgnote{position:absolute;left:8%;bottom:8%;right:30%;font:400 36px/1.4 var(--body);opacity:.85}
body:not(.landscape) .dghead{top:15%;left:12%;right:12%} body:not(.landscape) .dgnote{bottom:36%;left:12%;right:30%}

.sy{padding:0} .sytitle{position:absolute;left:110px;right:110px;top:330px;font:700 132px/1.1 var(--head)} .wd{display:inline-block;white-space:nowrap} .wv{display:inline-block}
.sysub{position:absolute;left:100px;right:100px;top:760px;font:500 62px/1.35 var(--body)} .syfine{position:absolute;left:100px;right:100px;top:1280px;font:400 50px/1.4 var(--body)}

/* question card (SB-K3) */
.qc{padding:400px 140px 600px 164px} .qcq{font:800 200px/1 var(--head);color:var(--accent);margin-bottom:30px} .qct{font-size:104px} .qcwho{margin-top:40px;font:500 56px var(--body);opacity:.85}
/* parallax / leak */
.fg{object-fit:cover} .leak{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 40%,rgba(255,170,90,.55),rgba(255,90,40,.25) 35%,transparent 60%);mix-blend-mode:screen;pointer-events:none}
/* themes */
.theme-swiss .h1{letter-spacing:-.02em} .theme-swiss .h2{letter-spacing:0}   /* tight tracking turned rn into m (retum): the review could not read it, nor can a phone */ .theme-swiss .beat::after{content:'';position:absolute;left:120px;right:120px;top:270px;height:4px;background:var(--accent)}

.theme-newspaper .light{background:#F1ECE1} .theme-newspaper .cv,.theme-newspaper .ct{background:#151515;color:#F1ECE1} .theme-newspaper .cv .kicker{color:#F1ECE1} .theme-newspaper .vd{background:#F1ECE1;color:#151515} .theme-newspaper .vdq{font-style:italic}

.theme-blueprint .dgnode{border-style:solid;background:rgba(11,61,145,.9)} .theme-blueprint .dgnode.key{color:#FFD166} .theme-blueprint .small{color:#EAF2FF} body:not(.landscape).theme-blueprint .small{font:400 54px/1.28 var(--head)} body:not(.landscape).theme-blueprint .handle{font-family:var(--head)}
.theme-organic .light,.theme-organic .dark{background:#F6EFE6;color:#3B2F2A} .theme-organic .sy::before{content:'';position:absolute;left:-180px;top:180px;width:620px;height:560px;border-radius:46% 54% 60% 40%/50% 40% 60% 50%;background:#F2C9B1;opacity:.7}

.theme-call .spframe{border-radius:18px;border:3px solid #2D8CFF} .theme-call .spname::before{content:'🎙 ';}

<body><div id="stage"></div>
<script>
// ---- the card (series format instance) -------------------------------------------------
const qs = new URLSearchParams(location.search), WIRE = qs.get('wire') === '1';
window.__timelines = {}; const FIX = [];   // geometry that needs the final fonts and layout runs just before the page reports ready
fetch(qs.get('card')).then(r => r.json()).then(build);

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function lines(parent, txt, cls) { const out = []; for (const t of [].concat(txt)) { const m = el('div', 'mask'); const l = el('span', 'line ' + (cls || ''), t); m.appendChild(l); parent.appendChild(m); out.push(l); } return out; }

function build(card) {
  const B = card.brand, root = document.documentElement.style;
  const H = card.height || 1920, W = card.width || 1080, PAGE = qs.get('page');   // carousel 1080×1350, square 1080×1080, landscape 1920×1080; ?page=N renders one page, finished
  document.documentElement.style.setProperty('--H', H + 'px'); document.documentElement.style.setProperty('--W', W + 'px');
  if (W > H) document.body.classList.add('landscape'); if (W === H) document.body.classList.add('square'); if (card.theme) document.body.classList.add('theme-' + card.theme); if (card.platform) document.body.classList.add('plat-' + card.platform);
  if (card.chrome === false) document.body.classList.add('nochrome');
  root.setProperty('--paper', B.colors.background); root.setProperty('--ink', B.colors.primary); root.setProperty('--accent', B.colors.accent); root.setProperty('--accent-ink', B.colors.accent_ink || B.colors.accent);
  root.setProperty('--head', `'${B.fonts.heading}', Georgia, serif`); root.setProperty('--body', `'${B.fonts.body}', Helvetica, sans-serif`);
  const link = el('link'); link.rel = 'stylesheet'; link.href = `https://fonts.googleapis.com/css2?family=${B.fonts.heading.replace(/ /g, '+')}:wght@400;600&family=${B.fonts.body.replace(/ /g, '+')}:wght@400;500;600&display=swap` + (B.fonts.extra || []).map(f => `&family=${f.replace(/ /g, '+')}`).join(''); document.head.appendChild(link);
  const stage = document.getElementById('stage'); if (WIRE) stage.classList.add('wire');

    const tone = b.tone || (i % 2 ? 'dark' : 'light');
    const M = motionOf(card, b), beat = el('section', 'beat ' + tone + ' en-' + M.enter); stage.appendChild(beat);
    if (WIRE) beat.appendChild(el('div', 'slotlabel', `${i + 1}｜${b.layout}｜${b.seconds}s`));
    if (b.layout !== 'disclosure') beat.appendChild(el('div', 'series', card.series || ''));   // the closing frame needs the room
    b._handle = B.handle || '';
    const L = LAYOUT[b.layout](beat, b, card);                 // returns {in: (tl, at) => end}
    // design outside the safe zone (owner rule): decorative type or a colour block that may be covered by platform UI without losing information
    const deco = b.deco ? el('div', 'deco ' + (b.deco_style || card.deco_style || 'ghost'), b.deco) : null; if (deco) { deco.setAttribute('aria-hidden', 'true'); beat.appendChild(deco); }

    if (V) visualLayer(beat, V, tl, PAGE !== null ? 0 : (TR === 'fade' && i > 0 ? t - 0.45 : t), b.seconds + (TR === 'fade' && i > 0 ? 0.45 : 0), i);
    if (PAGE !== null) { if (+PAGE === i) { tl.set(beat, { visibility: 'visible' }, 0); if (b.lower) lowerBlock(beat, b.lower, tl, 0, b.seconds || 3); L.in(tl, 0); } else beat.remove(); t = Math.max(t, +PAGE === i ? b.seconds || 3 : t); return; }
    const fade = TR === 'fade' && i > 0;            // photo stories: soft cross-fade instead of the brand panel
    tl.set(beat, { visibility: 'visible' }, fade ? t - 0.45 : t);
    if (fade) tl.fromTo(beat, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45, ease: 'sine.inOut' }, t - 0.45);
    if (L.hold) L.hold(tl, fade ? t - 0.45 : t, b.seconds + (fade ? 0.45 : 0));
    if (b.lower) lowerBlock(beat, b.lower, tl, fade ? t - 0.45 : t, b.seconds);
    if (deco) tl.fromTo(deco, { xPercent: 0 }, { xPercent: deco.classList.contains('vertical') ? 0 : -3, yPercent: deco.classList.contains('vertical') ? -3 : 0, duration: b.seconds, ease: 'none' }, t);
    const at0 = t + (i ? 0.25 : 0.05);

    if (TR === 'fade' || TR === 'cut') {
      if (i < card.beats.length - 1) tl.set(beat, { visibility: 'hidden' }, t + b.seconds + (TR === 'fade' ? 0.01 : 0));
    } else if (i < card.beats.length - 1) {                      // brand panel push into the next beat (色塊換場)
      const p = el('div', 'panel ' + (tone === 'dark' ? 'light' : 'dark')); stage.appendChild(p); gsap.set(p, { xPercent: 100 });
      const T = t + b.seconds; tl.fromTo(p, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: 'power3.in' }, T - 0.32)
        .set(beat, { visibility: 'hidden' }, T).to(p, { xPercent: -100, duration: 0.3, ease: 'power3.out' }, T);
    }

  });
  tl.set({}, {}, t); window.__timelines.card = tl; window.__duration = t;
  if (PAGE !== null) tl.seek(t, false);
  const fontsIn = new Promise(r => { link.onload = link.onerror = r; setTimeout(r, 8000); })   /* fonts.ready alone resolved before the Google Fonts sheet had even loaded: titles re-wrapped after the geometry was measured */
    .then(() => Promise.all([`600 80px '${B.fonts.heading}'`, `400 40px '${B.fonts.body}'`, `600 40px '${B.fonts.body}'`].map(f => document.fonts.load(f).catch(() => 0))));
  Promise.all([fontsIn, document.fonts.ready, ...[...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))]).then(() => new Promise(r => setTimeout(r, 400))).then(() => { FIX.forEach(f => f()); tl.seek(PAGE !== null ? t : 0, false); window.__ready = true; });
}

// ---- the lower block: what fills the frame under the safe zone, planned in the storyboard (owner rule 2026-11-14) ------------------------
// Platform UI may cover it, so it carries design or a repeat of what the beat already says, never the only copy of information.
//   {type:'panel', text, sub}      brand colour panel with the beat's key word or number, large and solid
//   {type:'progress', n, i, label} where this beat sits in the piece: n marks, the i-th filled
//   {type:'chips', items, on}      big rounded option cards (on = index of the highlighted one)
//   {type:'photo', image}          a real photo strip, slow push
//   {type:'sun'}                   synthwave sun on the horizon (theme piece)
function lowerBlock(beat, L, tl, at, dur) {
  const box = el('div', 'lower lw-' + L.type); box.setAttribute('aria-hidden', 'true'); beat.appendChild(box);
  if (L.type === 'panel') { const big = el('div', 'lwbig', L.text || ''); if (L.size) big.style.fontSize = L.size + 'px'; box.appendChild(big); if (L.sub) box.appendChild(el('div', 'lwsub', L.sub)); }
  if (L.type === 'progress') { const r = el('div', 'lwrail'); for (let j = 0; j < L.n; j++) r.appendChild(el('span', 'lwdot' + (j < L.i ? ' done' : j === L.i ? ' on' : ''), j === L.i ? String(j + 1) : '')); box.appendChild(r); if (L.label) box.appendChild(el('div', 'lwsub', L.label)); }
  if (L.type === 'chips') (L.items || []).forEach((x, j) => box.appendChild(el('div', 'lwchip' + (j === L.on ? ' on' : ''), x)));
  if (L.type === 'photo') { const im = el('img', 'lwimg'); im.src = L.image; box.appendChild(im); tl.fromTo(im, { scale: 1 }, { scale: 1.06, duration: dur, ease: 'none' }, at); }
  if (L.type === 'sun') box.appendChild(el('div', 'lwsun'));
  tl.from(box, { yPercent: 12, autoAlpha: 0, duration: 0.6, ease: 'expo.out' }, at + 0.15);
  if (L.type === 'chips') tl.from(box.children, { scale: 0.6, autoAlpha: 0, duration: 0.45, ease: 'back.out(2)', stagger: 0.12 }, at + 0.4);
}

// ---- the visual layer: full frame, behind the text, never limited by the safe zone (owner rule 2026-11-16) ----------------------
// One object or a list of them; each piece carries design only.
//   {type:'photo', image, push, scrim}  real photo over the whole frame, slow push (push 1.06 = 6 %); scrim:false when the photo is already dark or light enough
//   {type:'glow'}                       two soft brand-colour glows drifting slowly
//   {type:'numeral', text, outline}     a giant number or letter bleeding off the bottom right (chapter, step, year)
//   {type:'bars', n, seed}              brand bars rising from the bottom edge, an abstract chart rhythm
//   {type:'grid'}                       a perspective grid on the floor of the frame
//   {type:'band'}                       a solid brand band across the bottom third
//   {type:'word', text}                 one huge decorative word along the bottom edge
function visualLayer(beat, V, tl, at, dur, idx) {
  const box = el('div', 'vis'); box.setAttribute('aria-hidden', 'true'); beat.insertBefore(box, beat.firstChild);
  for (const v of [].concat(V)) {
    if (v.type === 'photo') { const im = el('img', 'v-photo'); im.src = v.image; if (v.focus) im.style.objectPosition = v.focus; box.appendChild(im);
      tl.fromTo(im, { scale: 1 }, { scale: v.push || 1.06, duration: dur, ease: 'none' }, at); if (v.scrim !== false) box.appendChild(el('div', 'v-scrim')); }
    if (v.type === 'glow') { const a = el('div', 'v-glow'), b2 = el('div', 'v-glow'); gsap.set(a, { left: -500, top: 900 }); gsap.set(b2, { left: 300, top: 1300 }); box.append(a, b2);
      tl.to(a, { x: 140, y: -80, duration: dur, ease: 'sine.inOut' }, at).to(b2, { x: -160, y: -120, duration: dur, ease: 'sine.inOut' }, at); }
    if (v.type === 'numeral') { const n = el('div', 'v-numeral' + (v.outline ? ' outline' : ''), v.text ?? String(idx + 1)); box.appendChild(n);
      tl.fromTo(n, { yPercent: 18, autoAlpha: 0 }, { yPercent: 0, autoAlpha: 1, duration: 0.9, ease: 'expo.out' }, at + 0.1).to(n, { yPercent: -3, duration: Math.max(0.1, dur - 1), ease: 'none' }, at + 1); }
    if (v.type === 'bars') { const w = el('div', 'v-bars'); let s = v.seed || idx + 1; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
      const bars = Array.from({ length: v.n || 9 }, (_, j) => { const b3 = el('div', 'v-bar'); b3.style.height = (30 + 70 * (v.rising ? (j + 1) / (v.n || 9) : rnd())) + '%'; w.appendChild(b3); return b3; }); box.appendChild(w);
      tl.from(bars, { scaleY: 0, duration: 0.8, ease: 'expo.out', stagger: 0.06 }, at + 0.15); }
    if (v.type === 'grid') { const g = el('div', 'v-grid'); box.appendChild(g); tl.fromTo(g, { backgroundPosition: '0 0' }, { backgroundPosition: '0 140px', duration: dur, ease: 'none' }, at); }
    if (v.type === 'band') { const g = el('div', 'v-band'); box.appendChild(g); tl.from(g, { yPercent: 100, duration: 0.7, ease: 'expo.out' }, at + 0.1); }
    if (v.type === 'word') { const g = el('div', 'v-word', v.text || ''); box.appendChild(g); tl.fromTo(g, { xPercent: 0 }, { xPercent: -6, duration: dur, ease: 'none' }, at); }
  }
}

// ---- layouts (components) --------------------------------------------------------------
// ---- motion settings: card.motion / beat.motion = {preset, speed, stagger, enter, ease, transition} ------------------------
// The layouts below are written in the 'crisp' numbers (the kit's look before 2026-11-17); a preset re-times them, it does not
// rewrite them. Kept in step with MOTION in build_layouts.py (layouts.json「動態設定」, checked by pb.py card-check and the tests).
const MOTION_PRESETS = {
  crisp:  { speed: 1,    stagger: 1,   enter: 'mask',  ease: null,         transition: 'panel' },
  calm:   { speed: 0.75, stagger: 1.4, enter: 'fade',  ease: 'power2.out', transition: 'fade' },
  soft:   { speed: 0.85, stagger: 1.2, enter: 'blur',  ease: 'sine.out',   transition: 'fade' },
  punchy: { speed: 1.3,  stagger: 0.7, enter: 'mask',  ease: 'expo.out',   transition: 'panel' },
};
const ENTER = { fade: { autoAlpha: 0, y: 40 }, blur: { autoAlpha: 0, filter: 'blur(16px)' }, scale: { autoAlpha: 0, scale: 0.86, transformOrigin: '0% 100%' } };
const ENTRY_EASE = /^(expo|power\d|sine|circ|cubic|quad|quart|quint)\.out$/;   // only the entrance family is re-eased: back.out (pop), inOut and none keep their role
function motionOf(card, b) {
  const c = card.motion || {}, m = (b && b.motion) || {}, P = MOTION_PRESETS;
  return m.preset ? Object.assign({}, P[m.preset] || P.crisp, m) : Object.assign({}, P[c.preset] || P.crisp, c, m);
}
// A stand-in for the timeline, handed to a layout's in(): durations and in-beat offsets scale by 1/speed, item gaps also by stagger,
// mask entrances (yPercent 110) become the chosen entrance. Untouched: ease 'none' (holds and drifts), repeat/yoyo, and offsets tied to
// the voiceover (a beat with step or captions keeps its positions). Starts are clamped so an entrance is in before the beat changes.
function paced(tl, base, M, keepPos, end) {
  const k = 1 / M.speed, st = M.stagger;
  if (k === 1 && st === 1 && !M.ease && M.enter === 'mask') return tl;
  const pos = p => typeof p !== 'number' || keepPos ? p : Math.min(base + (p - base) * k, Math.max(p, end - 0.6));
  const vars = (v, from) => {
    if (!v || typeof v !== 'object' || v.ease === 'none' || v.repeat !== undefined || v.yoyo) return v;
    const o = Object.assign({}, v);
    if (from && o.yPercent === 110 && M.enter !== 'mask' && ENTER[M.enter]) { delete o.yPercent; Object.assign(o, ENTER[M.enter]); }
    if (typeof o.duration === 'number') o.duration *= k;
    if (typeof o.stagger === 'number') o.stagger *= k * st;
    else if (o.stagger && typeof o.stagger.each === 'number') o.stagger = Object.assign({}, o.stagger, { each: o.stagger.each * k * st });
    if (M.ease && ENTRY_EASE.test(o.ease || 'power1.out')) o.ease = M.ease;
    return o;
  };
  const T = {
    from(t, v, p) { tl.from(t, vars(v, true), pos(p)); return T; },
    to(t, v, p) { tl.to(t, vars(v), pos(p)); return T; },
    fromTo(t, a, v, p) { tl.fromTo(t, a, vars(v), pos(p)); return T; },
    set(t, v, p) { tl.set(t, v, pos(p)); return T; },
  };
  return T;
}
const rise = (tl, items, at, stagger = 0.12) => { tl.from(items, { yPercent: 110, duration: 0.7, ease: 'expo.out', stagger }, at); return at + 0.7 + stagger * (items.length - 1); };
const LAYOUT = {
  hook(beat, b) { if (b.kicker) beat.appendChild(el('div', 'kicker', b.kicker)); const ls = lines(beat, b.text, 'h1'); ls.forEach(l => { l.style.fontSize = (b.size || 160) + 'px'; }); /* 160 px is the smallest size that measures 8 % in the review (0.6 s hook rule); 134 read 6.4 % */ const r = el('div', 'rule'); beat.appendChild(r);
    return { in: (tl, at) => { const e = rise(tl, ls, at, 0.09); tl.to(r, { width: 260, duration: 0.6, ease: 'power2.inOut' }, e - 0.2); return e; } }; },
  bignumber(beat, b) { const n = el('div', 'num accent', '0'); if (b.size) n.style.fontSize = b.size + 'px'; beat.appendChild(n); const ls = lines(beat, b.text, 'h2');
    const fmt = v => (b.prefix || '') + v.toLocaleString('en-US', { minimumFractionDigits: b.decimals || 0, maximumFractionDigits: b.decimals || 0 }) + (b.suffix || '');
    n.textContent = fmt(0);
    return { in: (tl, at) => { const o = { v: b.from || 0 }; tl.to(o, { v: b.value, duration: 1.4, ease: 'power4.out', onUpdate: () => { n.textContent = fmt(+o.v.toFixed(b.decimals || 0)); } }, at);
      tl.fromTo(n, { scale: .9 }, { scale: 1, duration: 1.2, ease: 'expo.out', transformOrigin: 'left center' }, at); return rise(tl, ls, at + 0.5); } }; },
  statement(beat, b) { if (b.kicker) beat.appendChild(el('div', 'kicker', b.kicker)); const ls = lines(beat, b.text, 'h2'); let r = null;

    const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'dgsvg'); beat.appendChild(svg);
    // portrait cut-down: the boxes stack in a column with an even gap, so they can never overlap whatever their height
    const stack = b.stack ? el('div', 'dgstack') : null; if (stack) head.appendChild(stack);   // inside the heading block, so it always starts under the last title line
    const nodes = (b.nodes || []).map(n => { const d = el('div', 'dgnode ' + (n.kind || ''), n.label);
      if (stack) stack.appendChild(d); else { d.style.left = n.x + '%'; d.style.top = n.y + '%'; if (n.w) d.style.width = n.w + '%'; beat.appendChild(d); } return d; });
    const box = n => { let x = 0, y = 0, e = n; while (e && e !== beat) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y, w: n.offsetWidth, h: n.offsetHeight }; };
    // a line runs from the edge of one box to the edge of the next (never under a box); direction is shown by an arrow that travels along it
    const edges = (b.edges || []).map(([a, c]) => { const line = document.createElementNS(NS, 'line'); line.setAttribute('class', 'dgedge'); svg.appendChild(line);
      const tip = document.createElementNS(NS, 'polygon'); tip.setAttribute('points', '-16,-11 6,0 -16,11'); tip.setAttribute('class', 'dgtip'); svg.appendChild(tip);
      const g = { a, c, line, tip, x1: 0, y1: 0, x2: 0, y2: 0 };
      g.measure = () => { const A = box(nodes[a]), C = box(nodes[c]);   /* measured again when the arrow plays: fonts that load late re-wrap the title and move the boxes */ svg.setAttribute('viewBox', `0 0 ${beat.offsetWidth} ${beat.offsetHeight}`);
        const my = (Math.max(A.y, C.y) + Math.min(A.y + A.h, C.y + C.h)) / 2, level = Math.min(A.y + A.h, C.y + C.h) > Math.max(A.y, C.y);   // side by side: one level line through the height both boxes share
        if (C.x >= A.x + A.w) Object.assign(g, { x1: A.x + A.w + 8, y1: level ? my : A.y + A.h / 2, x2: C.x - 12, y2: level ? my : C.y + C.h / 2 });
        else if (C.x + C.w <= A.x) Object.assign(g, { x1: A.x - 8, y1: level ? my : A.y + A.h / 2, x2: C.x + C.w + 12, y2: level ? my : C.y + C.h / 2 });
        else if (C.y >= A.y + A.h) Object.assign(g, { x1: A.x + A.w / 2, y1: A.y + A.h + 8, x2: C.x + C.w / 2, y2: C.y - 12 });
        else Object.assign(g, { x1: A.x + A.w / 2, y1: A.y - 8, x2: C.x + C.w / 2, y2: C.y + C.h + 12 });
        line.setAttribute('x1', g.x1); line.setAttribute('y1', g.y1); line.setAttribute('x2', g.x2); line.setAttribute('y2', g.y2); };
      FIX.push(g.measure); return g; });
    if (b.note) beat.appendChild(el('div', 'dgnote', b.note));
    return { in: (tl, at) => { const e = rise(tl, ls, at), step = 0.4, shown = i => e + i * step + 0.45;
      nodes.forEach((n, i) => tl.from(n, { autoAlpha: 0, scale: 0.85, duration: 0.45, ease: 'back.out(2)' }, e + i * step));     // boxes first
      edges.forEach(g => { const t0 = Math.max(shown(g.a), shown(g.c)), o = { p: 0 };                                     // a line only after both of its boxes
        const place = () => { g.measure(); const x = g.x1 + (g.x2 - g.x1) * o.p, y = g.y1 + (g.y2 - g.y1) * o.p, r = Math.atan2(g.y2 - g.y1, g.x2 - g.x1) * 180 / Math.PI; g.tip.setAttribute('transform', `translate(${x},${y}) rotate(${r})`); };
        tl.fromTo(g.line, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, onStart: g.measure }, t0).fromTo(g.tip, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, t0)
          .fromTo(o, { p: 0 }, { p: 1, duration: 0.8, ease: 'power1.inOut', onUpdate: place, repeat: 1, repeatDelay: 0.5 }, t0); });
      const n = beat.querySelector('.dgnote'); if (n) tl.from(n, { autoAlpha: 0, duration: 0.4 }, e + nodes.length * step); return e + nodes.length * step + 1.2; } };
  },
  // ---- SB-K9 限時動態: wavy title (波浪字), spring pop (彈簧), optional poll-sticker space kept empty for the real sticker ----------
  story(beat, b) {
    beat.classList.add('sy');
    const t = el('div', 'sytitle'); b.title.split(' ').forEach((w, i, a) => { const word = el('span', 'wd'); [...w].forEach(c => word.appendChild(el('span', 'wv', c))); t.appendChild(word); if (i < a.length - 1) t.appendChild(document.createTextNode(' ')); }); beat.appendChild(t);   // waves per letter, but words never break
    const sub = b.text ? el('div', 'sysub', b.text) : null; if (sub) beat.appendChild(sub);
    const poll = b.poll ? el('div', 'poll', WIRE ? b.poll : '') : null; if (poll) beat.appendChild(poll);   // the real sticker goes here in the app; keep it empty in the render
    if (b.fine) beat.appendChild(el('div', 'syfine', b.fine));
    const letters = t.querySelectorAll('.wv');
    return { hold: (tl, at, dur) => tl.to(letters, { y: -14, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: Math.ceil(dur / 0.6), stagger: { each: 0.06 } }, at),
             in: (tl, at) => { tl.from(letters, { scale: 0, duration: 0.5, ease: 'back.out(3)', stagger: 0.03 }, at); if (sub) tl.from(sub, { autoAlpha: 0, y: 30, duration: 0.5, ease: 'back.out(2)' }, at + 0.5);
               if (poll) tl.from(poll, { scale: 0.6, autoAlpha: 0, duration: 0.5, ease: 'back.out(2.5)' }, at + 0.8); return at + 1.2; } };
  },
  // ---- Zoom-style question card (SB-K3 訪談問答): the interviewer is a voice; the question is the picture --------------------------------
  question(beat, b) {
    beat.classList.add('qc');
    if (!b.size) beat.appendChild(el('div', 'qcq', 'Q'));   // the short hook form stands alone, big
    const ls = lines(beat, b.text, 'h2 qct'); if (b.size) ls.forEach(l => { l.style.fontSize = b.size + 'px'; });
    if (b.who) beat.appendChild(el('div', 'qcwho', b.who));
    return { in: (tl, at) => rise(tl, ls, at + 0.1, 0.1) };
  },
  // ---- carousel disclosure page: the compliance slide points, small but ≥ 2.5 % ---------------------------------------------------
  notes(beat, b) {
    beat.classList.add('nt');
    beat.appendChild(el('div', 'kicker', b.title || 'Important information'));
    const ul = el('div', 'ntlist'); (b.points || []).forEach(p => ul.appendChild(el('div', 'ntp', p))); beat.appendChild(ul);
    if (b.foot) beat.appendChild(el('div', 'ntfoot', b.foot));
    return { in: (tl, at) => { tl.from(ul.children, { autoAlpha: 0, y: 16, duration: 0.4, stagger: 0.1 }, at); return at + 1; } };
  },
  disclosure(beat, b) { const LS = document.body.classList.contains('landscape'), SQ = !LS && (document.documentElement.style.getPropertyValue('--H') === '1080px');
    // 9:16: anchored at the top of the safe zone and kept narrow (x ≤ 780 below y 840), so a long disclosure grows downward inside the zone, never up over the series bar
    const SH = document.body.classList.contains('plat-shorts');   // Shorts: the top bar is taller (y ≥ 380) but there is no button column and the zone runs to y 1540
    beat.style.justifyContent = LS || SQ ? 'center' : 'flex-start'; beat.style.paddingTop = LS || SQ ? '120px' : SH ? '420px' : '292px'; beat.style.paddingBottom = LS || SQ ? '120px' : SH ? '400px' : '640px'; beat.style.paddingRight = LS ? '700px' : SQ ? '160px' : SH ? '140px' : '300px'; beat.appendChild(el('div', 'kicker', b.title || 'Important information'));
    const p = el('div', 'small', b.text); beat.appendChild(p); beat.appendChild(el('div', 'handle', b._handle || ''));   /* in the flow, so a long disclosure pushes it down and never runs under it */
    if (b.cta) { const c = el('div', 'h2 ctaline', b.cta); c.style.marginBottom = '44px'; c.style.fontSize = '72px'; beat.insertBefore(c, beat.querySelector('.kicker')); }
    return { in: (tl, at) => { tl.from(beat.querySelectorAll('.kicker,.small,.h2'), { autoAlpha: 0, y: 30, duration: 0.6, ease: 'power2.out', stagger: 0.15 }, at); return at + 1; } }; },
};
